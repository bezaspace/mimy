# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Firebase client SDK config (mirrors .env.local)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCAxXrOKPDJWKTpaPV5Up8TKBCoOmsZm70"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "mayimeetyou.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "mayimeetyou"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "mayimeetyou.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "290016434320"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:290016434320:web:024e536155b9497cba6015"
    availability:
      - BUILD
      - RUNTIME

  # Vertex / Gemini config
  - variable: GCP_PROJECT_ID
    value: "mayimeetyou"
    availability:
      - BUILD
      - RUNTIME

  - variable: GCP_LOCATION
    value: "us-central1"
    availability:
      - BUILD
      - RUNTIME

  - variable: GEMINI_MODEL_ID
    value: "gemini-2.5-flash-lite"
    availability:
      - BUILD
      - RUNTIME

  # NOTE: FIREBASE_SERVICE_ACCOUNT_KEY is intentionally *not* set here.
  # In App Hosting, Firebase Admin and VertexAI use the backend's default
  # service account, so we keep that JSON key only for local dev scripts.
